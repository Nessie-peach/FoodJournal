name: FoodJournal
options:
  bundleIdPrefix: com.somethingwierd
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "$(TARGET_NAME)"
    ALWAYS_SEARCH_USER_PATHS: "NO"
  configs:
    debug:
      ENABLE_TESTABILITY: "YES"
targets:
  FoodJournal:
    type: application
    platform: iOS
    sources:
      - path: FoodJournal
        excludes:
          - "Info.plist"
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somethingwierd.FoodJournal
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: FoodJournal/FoodJournal.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: FoodJournal/Info.plist
      properties:
        CFBundleDisplayName: 今天吃什么
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSCameraUsageDescription: "拍照用于识别饮食内容并记录营养信息"
        NSHealthShareUsageDescription: "读取你的运动消耗、睡眠与心率数据，用于今日健康概览、统计与健康建议。"
  FoodJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoodJournalTests
    dependencies:
      - target: FoodJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somethingwierd.FoodJournalTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FoodJournal.app/FoodJournal
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  FoodJournal:
    build:
      targets:
        FoodJournal: all
    run:
      config: Debug
    test:
      config: Debug
      # 串行执行测试：@AppStorage/UserDefaults 为共享状态，并行会互相污染
      options:
        parallelizable: false
      targets:
        - FoodJournalTests
